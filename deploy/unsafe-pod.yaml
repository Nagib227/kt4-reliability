apiVersion: v1
kind: Namespace
metadata:
  name: campus-guard
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Pod
metadata:
  name: unsafe
  namespace: campus-guard
spec:
  containers:
    - name: unsafe
      image: mirror.gcr.io/library/postgres:16-alpine
      command: ["sleep", "30"]
      securityContext:
        privileged: true

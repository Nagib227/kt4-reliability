apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: campus-ready
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: campus-ready
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  namespace: campus-ready
spec:
  podSelector:
    matchLabels:
      app: campus-api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lab-client
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: otel
      ports:
        - port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker
  namespace: campus-ready
spec:
  podSelector:
    matchLabels:
      app: campus-worker
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: otel
      ports:
        - port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: campus-ready
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: campus-api
        - podSelector:
            matchLabels:
              app: campus-worker
        - podSelector:
            matchLabels:
              app: backup
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-dr
  namespace: campus-ready
spec:
  podSelector:
    matchLabels:
      app: postgres-dr
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backup
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel
  namespace: campus-ready
spec:
  podSelector:
    matchLabels:
      app: otel
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: campus-api
        - podSelector:
            matchLabels:
              app: campus-worker
      ports:
        - port: 4318
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 8888
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: campus-ready
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lab-client
      ports:
        - port: 9090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: campus-api
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: campus-worker
      ports:
        - port: 8081
    - to:
        - podSelector:
            matchLabels:
              app: otel
      ports:
        - port: 8888
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-client
  namespace: campus-ready
spec:
  podSelector:
    matchLabels:
      app: lab-client
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: campus-api
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup
  namespace: campus-ready
spec:
  podSelector:
    matchLabels:
      app: backup
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
        - podSelector:
            matchLabels:
              app: postgres-dr
      ports:
        - port: 5432

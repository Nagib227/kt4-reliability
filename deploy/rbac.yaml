apiVersion: v1
kind: ServiceAccount
metadata:
  name: campus-api
  namespace: campus-ready
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: campus-worker
  namespace: campus-ready
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: campus-ready
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-runner
  namespace: campus-ready
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-operator
  namespace: campus-ready
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-operator
  namespace: campus-ready
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-operator
  namespace: campus-ready
subjects:
  - kind: ServiceAccount
    name: incident-operator
    namespace: campus-ready
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-operator

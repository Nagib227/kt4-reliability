apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: campus-ready
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: campus-ready
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: mirror.gcr.io/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          args: ["-c", "shared_buffers=32MB", "-c", "max_connections=30"]
          env:
            - name: POSTGRES_USER
              value: campus
            - name: POSTGRES_DB
              value: campus
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-db
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "campus", "-d", "campus"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "campus", "-d", "campus"]
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: campus-ready
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-worker
  namespace: campus-ready
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-worker
  template:
    metadata:
      labels:
        app: campus-worker
    spec:
      serviceAccountName: campus-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: localhost:5001/campus-ready:kt4
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/worker.py"]
          ports:
            - containerPort: 8081
          env:
            - name: SERVICE_NAME
              value: campus-worker
            - name: PORT
              value: "8081"
            - name: APP_VERSION
              value: kt4
            - name: IMAGE_DIGEST
              value: unknown
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: campus-db
                  key: url
            - name: OTEL_ENDPOINT
              value: http://otel:4318
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/live', timeout=2)"]
            periodSeconds: 2
            failureThreshold: 40
          livenessProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/live', timeout=2)"]
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/live', timeout=2)"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: campus-worker
  namespace: campus-ready
spec:
  selector:
    app: campus-worker
  ports:
    - port: 8081
      targetPort: 8081

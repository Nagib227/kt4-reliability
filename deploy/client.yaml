apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-client
  namespace: campus-ready
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-client
  template:
    metadata:
      labels:
        app: lab-client
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: localhost:5001/campus-ready:kt4
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import time; time.sleep(86400)"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
